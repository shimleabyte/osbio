<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="OS-style portfolio experience">
  <title>Portofolio | Shymleabyte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>

<body>
  <!-- Boot Screen Layer -->
  <div id="boot-screen" class="screen">
    <div class="boot-content">
      <span class="boot-identity">shimleabyte.prtfl</span>
      <span class="boot-status">booting<span class="cursor">_</span></span>
    </div>
    <span class="boot-hint">press any key to skip</span>
  </div>

  <!-- Sign-in Demo Layer -->
  <div id="signin-screen" class="screen hidden">
    <div class="signin-panel">
      <div class="signin-header">
        <span class="signin-title">Welcome</span>
        <span class="signin-subtitle">to My Portofolio</span>
      </div>

      <div class="signin-form">
        <div class="signin-input-group">
          <label for="username" class="signin-label">Username</label>
          <input type="text" id="username" class="signin-input" value="guest" autocomplete="off" spellcheck="false">
        </div>

        <button id="enter-desktop-btn" class="signin-button">
          Enter Desktop
        </button>
      </div>

      <p class="signin-disclaimer">
        This is a demo. No real authentication. No data is stored.
      </p>
    </div>
  </div>

  <!-- Desktop Layer -->
  <div id="desktop-screen" class="screen hidden">
    <div class="desktop-welcome">
      <span class="desktop-name">Welcome!</span>
      <span class="desktop-tagline">to my Portfolio</span>
    </div>
    
    <!-- Windows will be dynamically inserted here -->
    
    <!-- Floating Taskbar -->
    <nav class="taskbar" role="navigation" aria-label="Desktop applications">
      <button class="taskbar-btn" data-app="about" aria-label="About">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 20c0-4 4-6 8-6s8 2 8 6" />
        </svg>
        <span class="taskbar-tooltip">About</span>
      </button>

      <button class="taskbar-btn" data-app="projects" aria-label="Projects">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="4" width="18" height="16" rx="2" />
          <path d="M3 10h18" />
          <path d="M9 4v6" />
        </svg>
        <span class="taskbar-tooltip">Projects</span>
      </button>

      <button class="taskbar-btn" data-app="contact" aria-label="Contact">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="2" y="4" width="20" height="16" rx="2" />
          <path d="M22 6l-10 7L2 6" />
        </svg>
        <span class="taskbar-tooltip">Contact</span>
      </button>

      <button class="taskbar-btn" data-app="resume" aria-label="Resume">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
          <path d="M14 2v6h6" />
          <path d="M8 13h8" />
          <path d="M8 17h8" />
        </svg>
        <span class="taskbar-tooltip">Resume</span>
      </button>

      <button class="taskbar-btn" data-app="terminal" aria-label="Terminal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="4" width="18" height="16" rx="2" />
          <path d="M7 9l3 3-3 3" />
          <path d="M13 15h4" />
        </svg>
        <span class="taskbar-tooltip">Terminal</span>
      </button>

      <button class="taskbar-btn" data-app="memory" aria-label="Memory Match">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="2" y="6" width="20" height="12" rx="3" />
          <circle cx="9" cy="12" r="2" />
          <circle cx="17" cy="10" r="1" />
          <circle cx="17" cy="14" r="1" />
        </svg>
        <span class="taskbar-tooltip">Memory Match</span>
      </button>
    </nav>
  </div>

  <script src="js/windowManager.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
