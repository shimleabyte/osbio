<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Shimleabyte's Pixel-Flow workstation: a small interactive desktop built with HTML, CSS and JavaScript.">
  <meta name="theme-color" content="#101512">
  <meta property="og:title" content="OSBio — Pixel-Flow Workstation">
  <meta property="og:description" content="A personal developer workspace with a custom desktop shell and app windows.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23101512'/%3E%3Cpath d='M4 4h8v8H4zM16 4h4v4h-4zM24 12h4v8h-4zM12 20h8v8h-8z' fill='%23e8d64a'/%3E%3C/svg%3E">
  <title>OSBio — Pixel-Flow Workstation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <noscript>This interactive portfolio needs JavaScript. Source: github.com/shimleabyte/osbio</noscript>
  <div id="boot-screen" class="screen boot-screen" role="status" aria-live="polite">
    <div class="boot-mark" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <div class="boot-content">
      <span class="boot-identity">OSBIO / PIXEL-FLOW</span>
      <span class="boot-status">INITIALIZING WORKSPACE</span>
      <div class="boot-progress" aria-hidden="true"><span></span></div>
    </div>
    <button id="boot-skip" class="boot-skip" type="button">SKIP BOOT <span>↵</span></button>
  </div>

  <div id="desktop-screen" class="screen hidden" aria-label="OSBio desktop" aria-hidden="true">
    <div class="desktop-wallpaper" aria-hidden="true"><div class="wallpaper-grid"></div><div class="wallpaper-block wallpaper-block-a"></div><div class="wallpaper-block wallpaper-block-b"></div></div>
    <header class="system-panel">
      <div class="panel-left">
        <button id="launcher-toggle" class="launcher-toggle" type="button" aria-expanded="false" aria-controls="app-launcher">
          <span class="pixel-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="launcher-wordmark">OSBIO</span><span class="panel-chevron" aria-hidden="true">+</span>
        </button>
        <span class="panel-divider" aria-hidden="true"></span><button id="window-overview-toggle" class="panel-mini-button" type="button" title="Open windows (Ctrl+Alt+W)" aria-label="Open window overview">WINDOWS</button><span class="panel-divider" aria-hidden="true"></span><span id="active-app-label" class="active-app-label">WORKSPACE / DESKTOP</span>
      </div>
      <div class="panel-right"><span class="local-status"><span class="status-square" aria-hidden="true"></span> LOCAL SESSION</span><span class="panel-divider" aria-hidden="true"></span><div class="panel-clock"><span id="system-clock">00:00</span><span id="system-date">01 JAN 2000</span></div></div>
    </header>

    <main id="desktop-surface" class="desktop-surface" tabindex="-1">
      <nav class="desktop-icons" aria-label="Desktop shortcuts">
        <button class="desktop-icon" type="button" data-app="files"><span class="app-icon app-icon-files" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>Files</span></button>
        <button class="desktop-icon" type="button" data-app="editor"><span class="app-icon app-icon-editor" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>Editor</span></button>
        <button class="desktop-icon" type="button" data-app="projects"><span class="app-icon app-icon-projects" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>Projects</span></button>
        <button class="desktop-icon" type="button" data-app="about"><span class="app-icon app-icon-about" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>Profile</span></button>
        <button class="desktop-icon" type="button" data-app="terminal"><span class="app-icon app-icon-terminal" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>Terminal</span></button>
      </nav>
      <div id="window-layer" class="window-layer" aria-live="polite"></div>
    </main>

    <aside id="app-launcher" class="app-launcher" aria-label="Application launcher" hidden>
      <div class="launcher-heading"><div><span class="launcher-overline">OSBIO / SHELL</span><h2>Applications</h2></div><span class="launcher-count">11 APPS</span></div>
      <label class="app-search-wrap" for="app-search"><span class="search-mark" aria-hidden="true">/</span><input id="app-search" type="search" placeholder="Find an application..." autocomplete="off" spellcheck="false"><kbd>CTRL K</kbd></label>
      <div id="launcher-grid" class="launcher-grid">
        <button class="launcher-item" type="button" data-app="files" data-search="files folder filesystem documents"><span class="app-icon app-icon-files" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="launcher-item-copy"><strong>Files</strong><small>LOCAL / DOCUMENTS</small></span><span class="launcher-item-index">07</span></button>
        <button class="launcher-item" type="button" data-app="editor" data-search="editor text notes markdown"><span class="app-icon app-icon-editor" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="launcher-item-copy"><strong>Editor</strong><small>TEXT / NOTES</small></span><span class="launcher-item-index">08</span></button>
        <button class="launcher-item" type="button" data-app="settings" data-search="settings preferences wallpaper appearance motion"><span class="app-icon app-icon-settings" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="launcher-item-copy"><strong>Settings</strong><small>APPEARANCE / WORKSPACE</small></span><span class="launcher-item-index">09</span></button>
        <button class="launcher-item" type="button" data-app="system" data-search="system monitor diagnostics events storage"><span class="app-icon app-icon-system" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="launcher-item-copy"><strong>System Monitor</strong><small>SESSION / EVENT LOG</small></span><span class="launcher-item-index">10</span></button>
        <button class="launcher-item" type="button" data-app="flow" data-search="flow monitor event trace state transitions"><span class="app-icon app-icon-flow" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="launcher-item-copy"><strong>Flow Monitor</strong><small>STATE / EVENT TRACE</small></span><span class="launcher-item-index">11</span></button>
        <button class="launcher-item" type="button" data-app="about" data-search="about profile bio information"><span class="app-icon app-icon-about" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="launcher-item-copy"><strong>Profile</strong><small>IDENTITY / STACK</small></span><span class="launcher-item-index">01</span></button>
        <button class="launcher-item" type="button" data-app="projects" data-search="projects repositories github work"><span class="app-icon app-icon-projects" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="launcher-item-copy"><strong>Projects</strong><small>REPOSITORIES / WORK</small></span><span class="launcher-item-index">02</span></button>
        <button class="launcher-item" type="button" data-app="terminal" data-search="terminal command line cli"><span class="app-icon app-icon-terminal" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="launcher-item-copy"><strong>Terminal</strong><small>COMMANDS / LINKS</small></span><span class="launcher-item-index">03</span></button>
        <button class="launcher-item" type="button" data-app="resume" data-search="resume cv curriculum vitae"><span class="app-icon app-icon-resume" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="launcher-item-copy"><strong>Resume</strong><small>NOT PUBLISHED</small></span><span class="launcher-item-index">04</span></button>
        <button class="launcher-item" type="button" data-app="contact" data-search="contact email github"><span class="app-icon app-icon-contact" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="launcher-item-copy"><strong>Contact</strong><small>EMAIL / GITHUB</small></span><span class="launcher-item-index">05</span></button>
        <button class="launcher-item" type="button" data-app="memory" data-search="memory match game puzzle"><span class="app-icon app-icon-memory" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="launcher-item-copy"><strong>Memory Match</strong><small>INTERACTIVE / GAME</small></span><span class="launcher-item-index">06</span></button>
      </div>
      <p id="launcher-empty" class="launcher-empty" hidden>No matching applications.</p>
      <footer class="launcher-footer"><span>LOCAL / NO ACCOUNT</span><span>ESC TO CLOSE</span></footer>
    </aside>

    <nav class="taskbar" aria-label="Open and pinned applications">
      <div class="taskbar-apps">
        <button class="taskbar-btn" type="button" data-app="files" aria-label="Files" title="Files"><span class="app-icon app-icon-files" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="taskbar-tooltip">Files</span></button>
        <button class="taskbar-btn" type="button" data-app="projects" aria-label="Projects" title="Projects"><span class="app-icon app-icon-projects" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="taskbar-tooltip">Projects</span></button>
        <button class="taskbar-btn" type="button" data-app="editor" aria-label="Editor" title="Editor"><span class="app-icon app-icon-editor" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="taskbar-tooltip">Editor</span></button>
        <button class="taskbar-btn" type="button" data-app="terminal" aria-label="Terminal" title="Terminal"><span class="app-icon app-icon-terminal" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="taskbar-tooltip">Terminal</span></button>
        <button class="taskbar-btn" type="button" data-app="about" aria-label="Profile" title="Profile"><span class="app-icon app-icon-about" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="taskbar-tooltip">Profile</span></button>
        <button class="taskbar-btn" type="button" data-app="memory" aria-label="Memory Match" title="Memory Match"><span class="app-icon app-icon-memory" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="taskbar-tooltip">Memory Match</span></button>
      </div>
      <div class="taskbar-system"><span class="taskbar-workspace">PF / 01</span><span class="taskbar-divider" aria-hidden="true"></span><span class="taskbar-caption">PIXEL-FLOW WORKSTATION</span></div>
    </nav>
  </div>
  <script src="js/osbioCore.js"></script>
  <script src="js/osbioSettings.js"></script>
  <script src="js/projectData.js"></script>
  <script src="js/windowManager.js"></script>
  <script src="js/workspaceApps.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
