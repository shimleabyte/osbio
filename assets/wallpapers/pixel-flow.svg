<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">OSBio Pixel-Flow desktop wallpaper</title>
  <desc id="desc">A dark green pixel-grid field with split-corner signal-yellow and mint ribbons dissolving into square pixels, beside the OSBio wordmark.</desc>
