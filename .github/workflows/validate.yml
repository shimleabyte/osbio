name: OSBio validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-smoke:
    name: Source and shell contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run dependency-free source checks
        run: node --test tests/source-smoke.test.mjs
      - name: Install pinned Playwright test runner
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.64.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run real-browser smoke tests
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/osbio-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 25); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/browser-smoke.cjs
      - name: Publish README screenshots
        if: success() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p docs/screenshots
          refresh_requested=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then refresh_requested=true; fi
          if [ ! -f docs/screenshots/osbio-desktop.png ] || [ "$refresh_requested" = "true" ]; then
            cp artifacts/osbio-desktop.png docs/screenshots/osbio-desktop.png
            cp artifacts/osbio-launcher.png docs/screenshots/osbio-launcher.png
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/screenshots/osbio-desktop.png docs/screenshots/osbio-launcher.png
            if git diff --cached --quiet; then
              echo "README screenshots are unchanged."
            else
              git commit -m "docs: capture current OSBio screenshots"
              git push origin HEAD:main
            fi
          else
            echo "README screenshots already exist; use workflow_dispatch to refresh them."
          fi
